<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1a0800"/>
<title>Ludo Arena — Morgan Okoth</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='12' fill='%23fbf8f0' stroke='%235c2a00' stroke-width='4'/><circle cx='32' cy='32' r='8' fill='%23c62828'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div class="stars" id="stars"></div>
<div id="stage"></div>
<div id="loading"><div class="spinner"></div><div>SETTING THE TABLE...</div></div>

<!-- MENU -->
<div id="menu" class="panel hidden">
  <h1>LUDO</h1>
  <p class="sub">ARENA · by Morgan Okoth</p>
  <div class="lobby-label">NUMBER OF PLAYERS</div>
  <div class="player-count-btns">
    <button class="pcb" data-n="2">2</button>
    <button class="pcb" data-n="3">3</button>
    <button class="pcb sel" data-n="4">4</button>
    <button class="pcb" data-n="5">5</button>
    <button class="pcb" data-n="6">6</button>
  </div>
  <div class="hint" id="shapeHint"></div>
  <div class="player-setup" id="playerSetup"></div>
  <button class="start-btn" id="startBtn">START GAME</button>
  <button class="on-btn wide" id="openOnline">🌍 PLAY ONLINE</button>
  <a class="classic" href="/classic.html">Classic 2D board</a>
</div>

<!-- ONLINE -->
<div id="online" class="panel hidden">
  <h2>ONLINE</h2>
  <div id="onJoinBox" class="col">
    <input class="on-input" id="onName" maxlength="20" placeholder="Your name" autocomplete="nickname"/>
    <button class="on-btn wide" id="onCreate">CREATE ROOM</button>
    <div class="lobby-label center">OR JOIN WITH A CODE</div>
    <div class="on-row">
      <input class="on-input code" id="onCode" maxlength="5" placeholder="CODE" autocomplete="off"/>
      <button class="on-btn" id="onJoin">JOIN</button>
    </div>
  </div>
  <div id="onRoom" class="col hidden">
    <div class="lobby-label center">ROOM CODE</div>
    <div class="room-code" id="roomCode" title="Copy invite link"></div>
    <button class="on-btn ghost" id="onCopy">SHARE INVITE LINK</button>
    <div class="hint" id="roomShape"></div>
    <div class="seats" id="seats"></div>
    <div id="hostTools" class="on-row hidden">
      <button class="on-btn ghost" id="addAiBtn">+ ADD AI</button>
      <button class="on-btn grow" id="startOnlineBtn">START GAME</button>
    </div>
    <div id="waitHost" class="on-msg hidden">Waiting for the host to start...</div>
  </div>
  <div class="on-msg" id="onMsg"></div>
  <button class="on-btn ghost" id="onBack">BACK</button>
</div>

<!-- GAME HUD -->
<div id="hud">
  <div class="hud-top">
    <div class="title">LUDO</div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="hud-corner">
    <button class="icon-btn" id="btnMute" title="Sound">🔊</button>
    <button class="icon-btn" id="btnView" title="Reset camera">🎥</button>
    <button class="icon-btn" id="btnMenu" title="Menu">☰</button>
  </div>
  <div class="hud-bottom">
    <div class="msg" id="msg"></div>
    <div class="crow">
      <div class="dval" id="dval">-</div>
      <button class="rbtn" id="rollBtn" disabled>ROLL</button>
    </div>
    <div class="instr" id="instr"></div>
  </div>
  <div id="results">
    <div class="panel results-card">
      <h2>RESULTS</h2>
      <div id="ranking"></div>
      <button class="start-btn" id="btnAgain">PLAY AGAIN</button>
      <button class="on-btn ghost" id="btnResultsMenu">MENU</button>
    </div>
  </div>
</div>
<div class="credit">© MORGANENTP · KISII UNIVERSITY</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
